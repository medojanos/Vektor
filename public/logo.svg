<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Vibrant Cyan-to-Blue Route Gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Accent Laser Magenta/Purple Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="100%" stop-color="#FFB199" />
    </linearGradient>

    <!-- Glow Filters for Neon Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Subtle Background Grid Lines representing coordinates/routing -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="400" x2="500" y2="400" />
  </g>

  <!-- Concentric Radar / Target Rings -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="4 8" />
  <circle cx="250" cy="220" r="95" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

  <!-- Route Nodes / Waypoints Background Markers -->
  <g fill="#ffffff" fill-opacity="0.2">
    <circle cx="140" cy="300" r="4" />
    <circle cx="330" cy="130" r="4" />
  </g>

  <!-- Main Dynamic Vector Path (The Route) -->
  <path d="M 140 300 L 210 260 L 290 170 L 360 140" 
        fill="none" 
        stroke="url(#routeGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Secondary/Alternative Route Vector (Dashed sleek path) -->
  <path d="M 140 300 Q 240 340 360 140" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="4" 
        stroke-dasharray="8 8" 
        stroke-linecap="round"
        opacity="0.6"
        filter="url(#subtleGlow)" />

  <!-- Origin Waypoint Pin -->
  <g transform="translate(140, 300)">
    <circle cx="0" cy="0" r="8" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#0B0F19" />
  </g>

  <!-- Destination Waypoint Pin (Highlighted Target) -->
  <g transform="translate(360, 140)">
    <!-- Outer radar pulse -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="10;24;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="10" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#0B0F19" />
  </g>

  <!-- Dynamic Vector Arrowhead / Vehicle Indicator -->
  <g transform="translate(290, 170) rotate(-35)">
    <polygon points="0,-12 10,10 0,4 -10,10" fill="#ffffff" filter="url(#subtleGlow)" />
  </g>

  <!-- Typography / App Name: VEKTOR -->
  <text x="250" y="415" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="12" 
        fill="#ffffff" 
        text-anchor="middle">
    VEKTOR
  </text>

  <!-- Subtitle Tagline -->
  <text x="250" y="445" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="12" 
        font-weight="500" 
        letter-spacing="6" 
        fill="#4FACFE" 
        text-anchor="middle"
        opacity="0.8">
    ROUTE PLANNING
  </text>
</svg>
